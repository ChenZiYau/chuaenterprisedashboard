name: Supabase Keep-Alive

# Writes a daily health-check entry to reduce free-tier inactivity pauses.
# Availability is not guaranteed. Runs daily (and can be run by hand
# from the Actions tab). Add SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY under
# Repo Settings -> Secrets and variables -> Actions.

on:
  schedule:
    - cron: "17 0 * * *" # Daily at 08:17 Asia/Kuala_Lumpur (00:17 UTC)
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Write daily database health check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/keepalive.mjs
