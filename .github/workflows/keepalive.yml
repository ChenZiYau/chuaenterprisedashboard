name: Supabase Keep-Alive

# Pings the Supabase database on a schedule so the free-tier project does not
# pause after ~7 days of inactivity. Runs every 3 days (and can be run by hand
# from the Actions tab). Add SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY under
# Repo Settings -> Secrets and variables -> Actions.

on:
  schedule:
    - cron: "0 6 */3 * *" # 06:00 UTC every 3rd day
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install @supabase/supabase-js --no-save
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/keepalive.mjs
